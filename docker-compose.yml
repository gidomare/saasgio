services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                uid: ${UID:-1000}
                user: ${USER:-gidomare}
        image: wms-app
        container_name: wms-app
        restart: unless-stopped
        working_dir: /var/www/html
        networks:
            - wms-network
        volumes:
            - ./:/var/www/html
            - vpn-config:/config
            - /var/run/docker.sock:/var/run/docker.sock
        depends_on:
            - database
            - redis

    vpn:
        image: lscr.io/linuxserver/wireguard:latest
        container_name: wms-vpn
        cap_add:
            - NET_ADMIN
            - SYS_MODULE
        environment:
            - PUID=${UID:-1000}
            - PGID=${GID:-1000}
        volumes:
            - vpn-config:/config
            - /lib/modules:/lib/modules
        networks:
            - wms-network
        sysctls:
            - net.ipv4.conf.all.src_valid_mark=1
        restart: unless-stopped

    web:
        image: nginx:alpine
        container_name: wms-nginx
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
        networks:
            - wms-network
        depends_on:
            - app

    database:
        image: mariadb:10.11
        container_name: wms-db
        restart: unless-stopped
        command: --skip-ssl
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-wms_db}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
            MYSQL_PASSWORD: ${DB_PASSWORD:-root}
            MYSQL_USER: ${DB_USERNAME:-wms_user}
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - db-data:/var/lib/mysql
        networks:
            - wms-network

    redis:
        image: redis:alpine
        container_name: wms-redis
        restart: unless-stopped
        volumes:
            - redis-data:/data
        networks:
            - wms-network

    snmp:
        build:
            context: ./docker/snmp
            dockerfile: Dockerfile
        image: wms-snmp
        container_name: wms-snmp
        restart: unless-stopped
        ports:
            - "162:162/udp"
        networks:
            - wms-network
        depends_on:
            - app

networks:
    wms-network:
        driver: bridge

volumes:
    db-data:
    redis-data:
    vpn-config:
